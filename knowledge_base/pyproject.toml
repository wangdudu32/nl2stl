[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stl-clarifier"
version = "0.1.0"
description = "Human-in-the-loop natural language to STL translator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.10,<3.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[project.scripts]
stl-clarifier = "stl_clarifier.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["stl_clarifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
