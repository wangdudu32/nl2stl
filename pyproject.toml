[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nl2stl"
version = "0.1.0"
description = "Human-in-the-loop natural language to STL translator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20,<5",
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-tavily>=0.2,<1",
  "langgraph>=1.0,<2",
  "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
nl2stl = "nl2stl_app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nl2stl_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
